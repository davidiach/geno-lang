schema_version = 2
language_version = "0.6"
description = "Geno 0.6 source and diagnostic compatibility corpus (draft until 0.6.0)"

# The 0.6 corpus carries every 0.5 case forward unchanged, then adds the
# contract changes of the 0.6 draft specification (`docs/spec/v0.6.md`):
# generic functions (proposal 0004), type parameter bounds (proposal 0005),
# method-call syntax (proposal 0006), types inferred from context
# (proposal 0007), expression forms (proposal 0008), the Result-only error model
# and `main() -> Result` (proposal 0009), the coherent standard library
# (proposal 0010), and non-transitive imports.
#
# A run case's `expected_exit_status` defaults to 0 when omitted, which is what
# every displayed result kind exits with. It is the status a host actually
# reports, so it is always 0-255: normalizing 258 to 2 is the implementation's
# job, and the case below states the 2 an executable is required to report.
#
# `expected_stderr = ""` is the "no traceback for an expected nonzero status"
# half of the contract: a status of 3 is a reported result, not a crash, so a
# host that prints a trace beside it fails.  `expected_json_value` is the JSON
# text of the `geno run --json` envelope's `value`, which stays *un*normalized:
# 258 is still 258 there while the process exits 2.
#
# Two entrypoint requirements deliberately stay in `geno/tests/test_exit_semantics.py`
# instead of here, because a case cannot state them: a synchronous `main` that
# returns an un-awaited `Async[Int]` is displayed, and its rendering is a host's
# own coroutine repr rather than stable text; and entry-module ownership needs a
# second module on disk, which the single-source `python` and `js` lanes do not
# compile.

[[cases]]
id = "arithmetic-control-flow"
path = "programs/arithmetic_control_flow.geno"
kind = "run"
targets = ["interpreter", "python", "js"]
capabilities = ["print"]
expected_stdout = "3\n2\n55\n"

