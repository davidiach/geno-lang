schema_version = 2
language_version = "0.5"
description = "Geno 0.5 source and diagnostic compatibility corpus"

# Most of these carry forward core 0.4 semantics that proposal 0001 does not
# change, so `--all-retained` keeps meaning something. Two groups are 0.5-only:
# module-constants, a language form #72 held back from 0.4.4 so v0.4 cannot carry
# it, and the exit-status cases below, which are the entrypoint contract of
# `docs/spec/v0.5.md` 4.1.1.
#
# A run case's `expected_exit_status` defaults to 0 when omitted, which is what
# every displayed result kind exits with. It is the status a host actually
# reports, so it is always 0-255: normalizing 258 to 2 is the implementation's
# job, and the case below states the 2 an executable is required to report.
#
# `expected_stderr = ""` is the "no traceback for an expected nonzero status"
# half of the contract: a status of 3 is a reported result, not a crash, so a
# host that prints a trace beside it fails.  `expected_json_value` is the JSON
# text of the `geno run --json` envelope's `value`, which stays *un*normalized:
# 258 is still 258 there while the process exits 2.

[[cases]]
id = "arithmetic-control-flow"
path = "programs/arithmetic_control_flow.geno"
kind = "run"
targets = ["interpreter", "python", "js"]
capabilities = ["print"]
expected_stdout = "3\n2\n55\n"

[[cases]]
id = "adt-pattern-matching"
path = "programs/adt_pattern_matching.geno"
kind = "run"
targets = ["interpreter", "python", "js"]
capabilities = ["print"]
expected_stdout = "75\n12\n9\n"

[[cases]]
id = "option-result"
path = "programs/option_result.geno"
kind = "run"
targets = ["interpreter", "python", "js"]
capabilities = ["print"]
expected_stdout = "10\n-1\n5\n-1\n"

[[cases]]
id = "module-constants"
path = "programs/module_constants.geno"
kind = "run"
targets = ["interpreter", "python", "js"]
capabilities = ["print"]
expected_stdout = "geno:1\nV\n7\n"

[[cases]]
id = "exit-status-unit"
path = "programs/exit_status_unit.geno"
kind = "run"
targets = [
    "interpreter",
    "cli-process",
    "cli-direct",
    "cli-json",
    "python",
    "js",
    "js-esm",
]
capabilities = ["print"]
expected_stdout = "unit entrypoint\n"
expected_exit_status = 0
expected_stderr = ""
expected_json_value = '{"_tuple": []}'

[[cases]]
id = "exit-status-int"
path = "programs/exit_status_int.geno"
kind = "run"
targets = [
    "interpreter",
    "cli-process",
    "cli-direct",
    "cli-json",
    "python",
    "js",
    "js-esm",
]
expected_stdout = ""
expected_exit_status = 3
expected_stderr = ""
expected_json_value = "3"

[[cases]]
