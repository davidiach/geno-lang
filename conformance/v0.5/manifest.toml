[[cases]]
id = "runtime-error-out-of-bounds"
path = "programs/runtime_error_out_of_bounds.geno"
kind = "run"
# Every lane that owns a real stderr, which is what this case is about. The
# `interpreter` lane returns diagnostics to its caller as data because it is an
# embedding boundary, and `cli-json` reports them inside the envelope, so
# neither has the channel `expected_stderr_contains` reads.
targets = [
    "cli-process",
    "cli-direct",
    "python",
    "js",
    "js-esm",
]
expected_stdout = ""
expected_exit_class = "nonzero"
expected_stderr_contains = ["Index 2 out of bounds"]

