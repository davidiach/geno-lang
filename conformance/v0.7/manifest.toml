# change (docs/operations/compatibility-policy.md), whose fix writes
# `example 1, 0 panics "division"`.
targets = ["checker"]
expected_diagnostics = ["E330"]

# Proposal 0013 (Accepted): the default isolated `geno run` lane grants
# capabilities with `--cap`, exactly the listed ones, for examples and `main`.
# The `cli-process` lane passes the case's `capabilities` as `--cap`, like the
# other CLI lanes, and the compiled lanes pass it to the compiled program, so
# each case also pins the isolated lane's output to the compiled backends'.
# These cases use only capabilities the lane grants on every platform; program
# arguments, the environment allowlist, stdin, fs and http are covered by the
# pytest suite, since a manifest has no argument or environment fields.

[[cases]]
id = "isolated-grant-regex"
path = "programs/isolated_grant_regex.geno"
kind = "run"
targets = [
    "interpreter",
    "cli-process",
    "cli-direct",
    "cli-json",
    "python",
    "js",
    "js-esm",
]
capabilities = ["print", "regex"]
expected_stdout = "101\nc_p_b_l_t__s\n3\n"
expected_exit_status = 0
expected_stderr = ""
expected_json_value = '{"_tuple": []}'

