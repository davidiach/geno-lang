[[cases]]
id = "isolated-grant-is-exact"
path = "programs/isolated_grant_regex.geno"
kind = "run"
# `--cap regex` is not added to the default grant: the examples call only the
# regex engine and pass, and `main`'s first `print` is denied. The interpreter
# and `--json` lanes report the denial as data, so only the lanes that own a
# stderr state it. Compiled programs never run examples, and their `main` is
# denied at the same `print` with the same message.
targets = ["cli-process", "cli-direct", "python", "js", "js-esm"]
capabilities = ["regex"]
expected_stdout = ""
expected_exit_class = "nonzero"
expected_stderr_contains = ["Capability denied: 'print' requires the 'print' capability"]

# Proposal 0018 (Draft): every runtime failure reports where it happened in
# Geno source and the Geno call stack that reached it, on every lane and
# backend: the interpreter lanes, the default isolated lane (compiled Python in
# the worker, mapped back to Geno source), and standalone compiled Python and
# JavaScript (mapped through the trace table they embed). Each frame is
# `file:line:col in name`, positioned inside that function: at the call it was
# making, or, for the innermost frame, at the failure.
#
# The fragments name the program by its file name, so they hold whatever
# absolute path a lane prints: the CLI lanes print the frontend's absolute
# path, and compiled artifacts print the path relative to the entry file. Only
# the CLI lanes can read the source, so only they print the snippet between
# the last frame and the message; fragments therefore never span lines. The
# `cli-json` lane reports the failure inside its envelope, which
# `expected_diagnostic` describes; the stderr fragments are not applied to it.
# The `interpreter` lane is an embedding boundary that returns diagnostics as
# data, which the API tests cover.

[[cases]]
id = "runtime-panic-stack"
path = "programs/runtime_panic_stack.geno"
kind = "run"
targets = ["cli-process", "cli-direct", "cli-json", "python", "js", "js-esm"]
capabilities = ["print"]
expected_stdout = "scaling\n"
expected_exit_class = "nonzero"
expected_stderr_contains = [
    "Stack trace (most recent call last):",
    "runtime_panic_stack.geno:21:12 in main",
    "runtime_panic_stack.geno:16:12 in scale",
    "runtime_panic_stack.geno:9:9 in check",
    "Runtime Error: value too large",
]

[cases.expected_diagnostic]
code = "E414"
message_contains = ["value too large"]
location = "runtime_panic_stack.geno:9:9"
stack = [
    "runtime_panic_stack.geno:21:12 in main",
    "runtime_panic_stack.geno:16:12 in scale",
    "runtime_panic_stack.geno:9:9 in check",
]

[[cases]]
id = "runtime-index-stack"
path = "programs/runtime_index_stack.geno"
kind = "run"
# The interpreter's message adds the list's length; compiled backends keep
# 0.6's shorter wording (proposal 0018, Backend And Target Parity), so the
# fragment is the shared prefix.
targets = ["cli-process", "cli-direct", "cli-json", "python", "js", "js-esm"]
expected_stdout = ""
expected_exit_class = "nonzero"
expected_stderr_contains = [
    "runtime_index_stack.geno:16:12 in main",
    "runtime_index_stack.geno:12:12 in outer",
    "runtime_index_stack.geno:7:12 in inner",
    "Runtime Error: Index 3 out of bounds",
]

[cases.expected_diagnostic]
code = "E401"
message_contains = ["Index 3 out of bounds"]
location = "runtime_index_stack.geno:7:12"
stack = [
    "runtime_index_stack.geno:16:12 in main",
    "runtime_index_stack.geno:12:12 in outer",
    "runtime_index_stack.geno:7:12 in inner",
]

