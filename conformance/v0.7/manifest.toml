schema_version = 2
language_version = "0.7"
status = "development"
description = "Geno 0.7 development corpus: cold-write forms (draft proposal 0026)"

# Unreleased additions to the retained v0.5 and v0.6 corpora. --all-retained
# runs those unchanged corpora first, then this one. This corpus is not frozen.
# Proposal 0026 is still Draft; release targeting does not record acceptance.
# Fix application, comment preservation, formatting and f-string nesting limits
# are additionally covered by geno/tests/test_cold_write_forms.py.

[[cases]]
id = "cold-write-compound-assignment"
path = "programs/cold_write_compound_assignment.geno"
kind = "run"
targets = ["interpreter", "python", "js"]
capabilities = ["print"]
expected_stdout = "10\n3.0\nab\n[1, 2, 3]\n[9, 20, 35]\n41\n"

[[cases]]
id = "cold-write-tuple-bindings"
path = "programs/cold_write_tuple_bindings.geno"
kind = "run"
targets = ["interpreter", "python", "js"]
capabilities = ["print"]
expected_stdout = "5\n[\"b\"]\n[11, 15]\n"

