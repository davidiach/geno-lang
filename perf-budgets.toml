# Performance ratchets for Geno.
#
# The same idea as the debt budgets in scripts/check_ci_dx_ratchets.py, applied
# to runtime numbers: measure a frozen workload, record what it costs today,
# and fail when a change makes it meaningfully worse. Enforced by
# `make perf-ratchets` (scripts/check_perf_ratchets.py).
#
# Re-baselining is a deliberate act. When a change legitimately moves a number
# — in either direction — run:
#
#     python3 scripts/check_perf_ratchets.py --update
#
# on the machine that enforces the budgets, and commit the result with the
# change that caused it. Wins must be recorded too: an unrecorded win is
# headroom for the next regression to hide in.

[calibration]
# Machine speed on a fixed CPU-bound workload (benchmarks/cli_latency.py),
# measured alongside the baselines below. Budgets are scaled by
# measured/reference so they survive being checked on slower hardware.
reference_ms = 7.78

# Scaling only ever relaxes budgets, never tightens them: a machine that is
# faster than the reference gets free headroom rather than a spurious failure
# from a calibration workload that does not perfectly track CLI cost. The cap
# stops a pathologically noisy runner from disabling the check entirely.
max_scale = 4.0

[cli_latency]
# Measured runs per scenario, and warmups discarded before measuring. The
# ratchet checks the minimum of the measured runs: scheduler noise only ever
# adds time, so the minimum is the stable estimator.
runs = 5
warmups = 2

# Allowed regression over the recorded baseline before the check fails. 20%
# is wide enough to absorb runner noise (repeat suite runs vary by ~5% here)
# and tight enough to catch the regressions worth catching — re-importing the
# frontend in the `geno run` parent process, for instance, costs ~25%.
headroom = 1.20

# Minimum of 9 runs, recorded on Linux / CPython 3.11.
[cli_latency.baseline_ms]
version = 61.8
check-medium = 156.0
test-medium = 178.6
run-hello = 468.9
run-medium = 522.8
compile-medium = 294.7
