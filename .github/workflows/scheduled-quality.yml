name: Performance environment diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: performance-environment-diagnostic
  cancel-in-progress: false
jobs:
  scheduler-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6449724f2de38d3e58d667a548bffb605b76bbc6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install the unchanged runtime environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Compare normal and first-allowed-CPU scheduling
        run: |
          cat > "$RUNNER_TEMP/geno-perf-affinity.py" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import resource
          import subprocess
          import sys
          import sysconfig
          import time

          root = Path(os.environ["GITHUB_WORKSPACE"])
          out = Path(os.environ["RUNNER_TEMP"]) / "geno-perf-affinity"
          out.mkdir(parents=True, exist_ok=True)
          allowed = sorted(os.sched_getaffinity(0))
          fixed = {allowed[0]}
          source = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if source != "6449724f2de38d3e58d667a548bffb605b76bbc6":
              raise RuntimeError("Unexpected candidate")
          budget_sha = hashlib.sha256((root / "perf-budgets.toml").read_bytes()).hexdigest()
          order = [("A1", allowed), ("B1", fixed), ("B2", fixed), ("A2", allowed)]
          records = []
          for label, affinity in order:
              os.sched_setaffinity(0, affinity)
              before = resource.getrusage(resource.RUSAGE_CHILDREN)
              started = time.perf_counter()
              result = subprocess.run([sys.executable, "scripts/check_perf_ratchets.py", "--out", str(out / (label + ".json"))], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              elapsed = time.perf_counter() - started
              after = resource.getrusage(resource.RUSAGE_CHILDREN)
              (out / (label + ".log")).write_text(result.stdout)
              record = {"label": label, "affinity": sorted(affinity), "exit_code": result.returncode,
                        "wall_seconds": elapsed, "child_user_seconds": after.ru_utime-before.ru_utime,
                        "child_system_seconds": after.ru_stime-before.ru_stime,
                        "child_voluntary_switches": after.ru_nvcsw-before.ru_nvcsw,
                        "child_involuntary_switches": after.ru_nivcsw-before.ru_nivcsw,
                        "measurement": json.loads((out / (label + ".json")).read_text())}
              records.append(record)
              print(json.dumps(record), flush=True)
          os.sched_setaffinity(0, allowed)
          for label, affinity in [("normal", allowed), ("fixed", fixed)]:
              os.sched_setaffinity(0, affinity)
              result = subprocess.run([sys.executable, "-X", "importtime", "-m", "geno", "check", "benchmarks/fixtures/medium.geno"], text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              (out / (label + "-importtime.txt")).write_text(result.stderr)
              if result.returncode:
                  raise RuntimeError("Profile command failed")
          os.sched_setaffinity(0, allowed)
          summary = {"purpose": "Fixed scheduler A-B-B-A experiment; not release qualification",
                     "source": source, "budget_sha256": budget_sha,
                     "python": sys.version, "executable": sys.executable, "platform": platform.platform(),
                     "python_build": {key: sysconfig.get_config_var(key) for key in ["CONFIG_ARGS", "CFLAGS", "Py_DEBUG", "WITH_PYMALLOC"]},
                     "allowed_cpus": allowed, "fixed_cpu": min(fixed),
                     "cpuinfo": Path("/proc/cpuinfo").read_text(),
                     "cpu_stat": Path("/sys/fs/cgroup/cpu.stat").read_text(),
                     "records": records}
          (out / "summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          print("Diagnostic complete. Preserve every failure; no automatic retry or release authorization.")

          PY
          python "$RUNNER_TEMP/geno-perf-affinity.py"
      - name: Preserve all observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: stable-performance-affinity
          path: ${{ runner.temp }}/geno-perf-affinity/
          if-no-files-found: error
          retention-days: 90
