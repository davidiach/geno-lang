name: Scheduled Quality

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deep-conformance-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run frozen conformance corpus
        run: python scripts/run_conformance.py --all-retained --target all --require-node --json

      - name: Run deep differential fuzzing
        env:
          GENO_FUZZ_DEEP: '1'
        run: >-
          python -m pytest geno/tests/test_differential_fuzzing.py
          -q --tb=short --timeout=900

      - name: Retain minimized fuzz failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scheduled-fuzz-failures-${{ github.run_id }}
          path: |
            .hypothesis/
            geno/tests/fuzzing/failures/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30

  cli-latency-ratchet:
    # Not on PR CI yet. The budgets in perf-budgets.toml were recorded on a
    # developer machine, and the calibration in benchmarks/cli_latency.py only
    # ever widens them, never tightens — so a hosted runner needs a few clean
    # weekly runs before the numbers are trustworthy enough to gate merges on.
    # Promote this to .github/workflows/ci.yml once they are, re-recording the
    # baselines on the runner with `make perf-ratchets-update`.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "."

      - name: Enforce performance budgets
        run: make perf-ratchets PYTHON=python

      - name: Record the measurement
        if: always()
        run: python scripts/check_perf_ratchets.py --json > cli-latency.json || true

      - name: Upload the measurement
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-latency-${{ github.run_id }}
          path: cli-latency.json
          if-no-files-found: warn
          retention-days: 90
