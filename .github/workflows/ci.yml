name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clean-install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          requirements.lock

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '20'

    - name: Build and install wheel
      run: |
        python -m pip install --upgrade pip
        python -m pip wheel . --wheel-dir dist
        python -m pip install --force-reinstall dist/*.whl

    - name: Run clean install smoke
      run: python scripts/smoke_clean_install.py

  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          requirements-dev.lock
          requirements-release.lock

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: vscode-geno/package-lock.json

    - name: Install dependencies
      run: |
        python -m pip install -e ".[dev]"

    - name: Run release-specific validators
      run: make release-validators PYTHON=python

  optional-test-collection:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          requirements-dev.lock

    - name: Install without Hypothesis
      run: |
        python -m pip install -e .
        python -m pip install "pytest>=9.0.3,<10"

    - name: Collect optional property tests
      run: make optional-test-collection PYTHON=python

  fuzz-property-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          requirements-dev.lock

    - name: Install dependencies
      run: |
        python -m pip install -e ".[dev]"

    - name: Run fuzz and property tests
      run: python -m pytest geno/tests/test_property_based.py geno/tests/test_fuzzing.py geno/tests/test_differential_fuzzing.py -q --tb=short --timeout=60

  lsp-tests:
    # The main matrix omits the optional LSP dependencies. Exercise every test
    # module that imports the LSP server or gates behavior on pygls/lsprotocol,
    # without repeating the unrelated 5,000+ test suite.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          requirements-dev.lock

    - name: Install LSP dependencies
      run: |
        python -m pip install -e ".[dev,lsp]"

    - name: Run LSP test slice
      run: >-
        python -m pytest
        geno/tests/test_lsp.py
        geno/tests/test_lsp_cache.py
        geno/tests/test_lsp_helpers.py
        geno/tests/test_medium_fixes.py
        geno/tests/test_project_resolution_consistency.py
        -q --tb=short --timeout=60

  sandbox-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          requirements-dev.lock

    - name: Install dependencies
      run: |
        python -m pip install -e ".[dev]"

    - name: Run sandbox regression slice
      run: make sandbox-regression PYTHON=python

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: |
          requirements.lock
          requirements-dev.lock
          requirements-release.lock

    - name: Install dependencies
      run: |
        python -m pip install "pip-audit==2.10.0"

    - name: Audit Python dependencies
      run: make dependency-audit PYTHON=python

  docker-smoke:
    # Exercises the shipped Docker/compose deployment so a broken image or a
    # misconfigured runtime (Host allow-list, missing SIGTERM handling, OOM
    # sizing) is caught before release (M-02).
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Build image
      run: docker build -t geno-server:ci .

    - name: Start container
      run: |
        docker run -d --name geno-ci \
          -e GENO_API_KEY=ci-smoke-key \
          -e GENO_ALLOWED_HOSTS='*' \
          -p 127.0.0.1:8000:8000 \
          geno-server:ci

    - name: Wait for healthy
      run: |
        for i in $(seq 1 30); do
          status=$(docker inspect --format '{{.State.Health.Status}}' geno-ci 2>/dev/null || echo starting)
          if [ "$status" = "healthy" ]; then echo "healthy"; exit 0; fi
          sleep 2
        done
        echo "container never became healthy"; docker logs geno-ci; exit 1

    - name: Smoke /healthz and /run
      run: |
        code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/healthz)
        [ "$code" = "200" ] || { echo "healthz status=$code"; exit 1; }
        body=$(curl -sS -X POST http://127.0.0.1:8000/run \
          -H 'X-API-Key: ci-smoke-key' -H 'Content-Type: application/json' \
          -d '{"source":"func main() -> Int\n  example () -> 3\n  return 1 + 2\nend func"}')
        echo "$body"
        echo "$body" | grep -q '"ok":true' || { echo "run did not return ok"; exit 1; }
        echo "$body" | grep -q '"value":3' || { echo "run returned wrong value"; exit 1; }

    - name: Assert graceful stop within grace period
      run: |
        # docker stop sends SIGTERM; the server must exit before the 10s SIGKILL.
        start=$(date +%s)
        docker stop -t 10 geno-ci
        elapsed=$(( $(date +%s) - start ))
        echo "stopped in ${elapsed}s"
        [ "$elapsed" -lt 10 ] || { echo "did not stop gracefully before SIGKILL"; exit 1; }

    - name: Cleanup
      if: always()
      run: docker rm -f geno-ci || true

  coverage-shard:
    name: coverage-shard (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python 3.11
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          requirements-dev.lock

    - name: Install dependencies
      # Include the LSP extra: without pygls the LSP suites skip, leaving
      # geno/lsp_server.py at 20% and pulling measured coverage below the
      # floor even though lsp-tests exercises that code in its own job.
      run: python -m pip install -e ".[dev,lsp]"

    - name: Run coverage shard
      env:
        COVERAGE_FILE: coverage-data/coverage.${{ matrix.shard }}
      run: |
        mkdir -p coverage-data
        python scripts/pytest_shard.py \
          --shard-index ${{ matrix.shard }} \
          --shard-count 3 \
          --balance-profile coverage-ubuntu-py311 \
          --plan-manifest coverage-data/shard-plan.${{ matrix.shard }}.json \
          --timing-manifest coverage-data/shard-timing.${{ matrix.shard }}.json \
          -- \
          -q --tb=short --timeout=60 --cov=geno --cov-report=
        test -s coverage-data/coverage.${{ matrix.shard }}
        test -s coverage-data/shard-plan.${{ matrix.shard }}.json
        test -s coverage-data/shard-timing.${{ matrix.shard }}.json

    - name: Upload coverage shard
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        # Keep successful legs available when only failed jobs are retried.
        name: coverage-data-${{ matrix.shard }}
        overwrite: true
        path: |
          coverage-data/coverage.${{ matrix.shard }}
          coverage-data/shard-plan.${{ matrix.shard }}.json
          coverage-data/shard-timing.${{ matrix.shard }}.json
        if-no-files-found: error
        retention-days: 14

  coverage-report:
    name: test (ubuntu-latest, 3.11)
    if: ${{ always() }}
    needs: coverage-shard
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Require successful coverage shards
      if: needs.coverage-shard.result != 'success'
      run: |
        echo "::error::coverage shard result was ${{ needs.coverage-shard.result }}"
        exit 1

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python 3.11
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          requirements-dev.lock

    - name: Install dependencies
      run: python -m pip install -e ".[dev]"

    - name: Download coverage shards
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: coverage-data-*
        path: coverage-data
        merge-multiple: true

    - name: Combine coverage and enforce threshold
      env:
        COVERAGE_FILE: coverage-data/.coverage
      run: |
        mapfile -t plan_files < <(
          find coverage-data -maxdepth 1 -type f -name 'shard-plan.*.json' -print | sort
        )
        if [ "${#plan_files[@]}" -ne 3 ]; then
          echo "::error::expected 3 shard plans, found ${#plan_files[@]}"
          exit 1
        fi
        mapfile -t timing_files < <(
          find coverage-data -maxdepth 1 -type f -name 'shard-timing.*.json' -print | sort
        )
        if [ "${#timing_files[@]}" -ne 3 ]; then
          echo "::error::expected 3 shard timings, found ${#timing_files[@]}"
          exit 1
        fi
        python scripts/pytest_shard.py \
          --allow-mixed-attempts \
          --validate-plan-manifests "${plan_files[@]}" \
          --timing-manifests "${timing_files[@]}"

        mapfile -t coverage_files < <(
          find coverage-data -maxdepth 1 -type f -name 'coverage.*' -print | sort
        )
        if [ "${#coverage_files[@]}" -ne 3 ]; then
          echo "::error::expected 3 coverage shards, found ${#coverage_files[@]}"
          exit 1
        fi
        python -m coverage combine "${coverage_files[@]}"
        python -m coverage report --fail-under=80
        python -m coverage xml -o coverage.xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

    - name: Run type checker on examples
      run: |
        for f in examples/*.geno; do
          if [ -f "$f" ]; then
            echo "Checking $f..."
            python -m geno check "$f"
          fi
        done

    - name: Selfhost parity check
      run: python scripts/check_selfhost_parity.py

    - name: Selfhost smoke check
      run: |
        for f in selfhost/*.geno; do
          echo "Checking $f..."
          python -m geno check "$f"
        done

  compatibility-ubuntu-310:
    name: compatibility-shard (ubuntu-latest, 3.10, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python 3.10
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.10'
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          requirements-dev.lock

    - name: Install dependencies
      run: python -m pip install -e ".[dev]"

    - name: Run compatibility shard without coverage
      run: |
        python scripts/pytest_shard.py \
          --shard-index ${{ matrix.shard }} \
          --shard-count 2 \
          -- \
          -q --tb=short --timeout=60

  compatibility-ubuntu-312:
    name: compatibility-shard (ubuntu-latest, 3.12, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python 3.12
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          requirements-dev.lock

    - name: Install dependencies
      run: python -m pip install -e ".[dev]"

    - name: Run compatibility shard without coverage
      run: |
        python scripts/pytest_shard.py \
          --shard-index ${{ matrix.shard }} \
          --shard-count 2 \
          -- \
          -q --tb=short --timeout=60

  compatibility-ubuntu-313:
    name: compatibility-shard (ubuntu-latest, 3.13, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python 3.13
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          requirements-dev.lock

    - name: Install dependencies
      run: python -m pip install -e ".[dev]"

    - name: Run compatibility shard without coverage
      run: |
        python scripts/pytest_shard.py \
          --shard-index ${{ matrix.shard }} \
          --shard-count 2 \
          -- \
          -q --tb=short --timeout=60

  compatibility-macos-311:
    name: compatibility-shard (macos-latest, 3.11, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]

    runs-on: macos-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python 3.11
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          requirements-dev.lock

    - name: Install dependencies
      run: python -m pip install -e ".[dev]"

    - name: Run compatibility shard without coverage
      run: |
        python scripts/pytest_shard.py \
          --shard-index ${{ matrix.shard }} \
          --shard-count 2 \
          -- \
          -q --tb=short --timeout=60

  compatibility-ubuntu-310-report:
    name: test (ubuntu-latest, 3.10)
    if: ${{ always() }}
    needs: compatibility-ubuntu-310
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Require successful Ubuntu/Python 3.10 shards
      env:
        SHARD_RESULT: ${{ needs.compatibility-ubuntu-310.result }}
      run: |
        if [ "$SHARD_RESULT" != "success" ]; then
          echo "::error::compatibility shard result was $SHARD_RESULT"
          exit 1
        fi

  compatibility-ubuntu-312-report:
    name: test (ubuntu-latest, 3.12)
    if: ${{ always() }}
    needs: compatibility-ubuntu-312
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Require successful Ubuntu/Python 3.12 shards
      env:
        SHARD_RESULT: ${{ needs.compatibility-ubuntu-312.result }}
      run: |
        if [ "$SHARD_RESULT" != "success" ]; then
          echo "::error::compatibility shard result was $SHARD_RESULT"
          exit 1
        fi

  compatibility-ubuntu-313-report:
    name: test (ubuntu-latest, 3.13)
    if: ${{ always() }}
    needs: compatibility-ubuntu-313
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Require successful Ubuntu/Python 3.13 shards
      env:
        SHARD_RESULT: ${{ needs.compatibility-ubuntu-313.result }}
      run: |
        if [ "$SHARD_RESULT" != "success" ]; then
          echo "::error::compatibility shard result was $SHARD_RESULT"
          exit 1
        fi

  compatibility-macos-311-report:
    name: test (macos-latest, 3.11)
    if: ${{ always() }}
    needs: compatibility-macos-311
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Require successful macOS/Python 3.11 shards
      env:
        SHARD_RESULT: ${{ needs.compatibility-macos-311.result }}
      run: |
        if [ "$SHARD_RESULT" != "success" ]; then
          echo "::error::compatibility shard result was $SHARD_RESULT"
          exit 1
        fi

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          requirements-dev.lock

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        python -m pip install -e ".[dev,lsp]"

    - name: Run Windows smoke tests
      run: python -m pytest geno/tests/test_cli.py geno/tests/test_api.py geno/tests/test_compiler.py geno/tests/test_js_compiler.py geno/tests/test_package_index.py geno/tests/test_sandbox_config.py geno/tests/test_package_manager.py::TestManifestParse::test_manifest_filesystem_sensitive_dependency_name_raises -q --tb=short --timeout=60

    - name: Run Windows LSP and project-resolution tests
      run: python -m pytest geno/tests/test_lsp.py geno/tests/test_project_resolution_consistency.py -q --tb=short --timeout=60

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          requirements-dev.lock

    - name: Install dependencies
      run: |
        python -m pip install -e ".[dev]"

    - name: Check formatting and linting with ruff
      run: |
        python -m ruff check geno/ benchmark/ experiment/ analysis/
        python -m ruff format --check geno/ benchmark/ experiment/ analysis/

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          requirements-dev.lock

    - name: Install dependencies
      run: |
        python -m pip install -e ".[dev]"

    - name: Run mypy
      run: |
        python -m mypy geno/ --ignore-missing-imports --no-error-summary

  js-output:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          requirements-dev.lock

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        python -m pip install -e ".[dev]"
        npm install -g typescript@7.0.2

    - name: Validate JS compilation and source maps
      run: |
        set -euo pipefail

        # Compile a test program
        cat > /tmp/test.geno <<'GENO'
        type Shape = Circle(radius: Float) | Rectangle(w: Float, h: Float)

        func area(s: Shape) -> Float
            example Circle(1.0) -> 3.14159
            match s with
                | Circle(r) -> return 3.14159 * r * r
                | Rectangle(w, h) -> return w * h
            end match
        end func
        GENO

        # Standard JS compile (must use --target js)
        python -m geno compile /tmp/test.geno --target js -o /tmp/test.js
        echo "  JS compile OK"

        # ESM compile
        python -m geno compile /tmp/test.geno --target js --esm -o /tmp/test.mjs
        echo "  ESM compile OK"

        # Validate ESM is importable by Node
        node --input-type=module -e "await import('file:///tmp/test.mjs')" 2>&1
        echo "  ESM import OK"

        # Validate .d.ts with tsc (blocking — fail the job on errors)
        if [ -f /tmp/test.d.ts ]; then
          tsc --noEmit --strict /tmp/test.d.ts 2>&1
          echo "  .d.ts validation OK"
        fi

        # Source map structure check (must use --target js)
        python -m geno compile /tmp/test.geno --target js --source-map -o /tmp/sm_test.js
        if [ -f /tmp/sm_test.js.map ]; then
          python3 -c "
        import json, sys
        sm = json.load(open('/tmp/sm_test.js.map'))
        assert sm['version'] == 3, 'Bad source map version'
        assert 'mappings' in sm, 'Missing mappings'
        assert 'sources' in sm, 'Missing sources'
        print('  Source map structure OK')
        "
        fi

    - name: Run semantic source map tests
      run: python -m pytest geno/tests/test_js_source_maps.py -q

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          requirements-dev.lock

    - name: Install dependencies
      run: |
        python -m pip install -e ".[dev]"

    - name: Run security lint
      run: |
        python -m ruff check geno/ --select S --ignore S101

    - name: Run security corpus and bounty
      run: make security PYTHON=python
