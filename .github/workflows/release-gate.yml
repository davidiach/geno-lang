name: Release Gate

# Template and example-app gates run here for fast feedback. CI runs the
# non-duplicating release validator slice; publishing runs `make release-check`.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          requirements-dev.lock

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '20'

    - name: Install Geno
      run: |
        python -m pip install -e ".[dev]"

    - name: Scaffold and smoke-test init templates
      run: PYTHON=python bash scripts/release-gate-templates.sh

    - name: Discover and validate example apps
      run: python scripts/release_gate_apps.py
