name: website

# Builds website/ (playground bundle, examples, blog) and deploys it to
# GitHub Pages. Manual only: enable Pages with "GitHub Actions" as the source
# in the repository settings, then run this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Geno
        run: python -m pip install -e .
      - name: Build the site and verify every playground example
        run: python website/build.py --verify
      - name: Leave build inputs out of the published site
        run: rm -rf website/README.md website/build.py website/md_render.py website/og-images.cjs website/.gitignore website/_templates website/shared/posts website/shared/examples
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
